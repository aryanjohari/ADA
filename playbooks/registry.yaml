registry_version: 1
kind_default_playbook:
  rss_fetch_then_graph_then_synth: ingest_rss_summarize
  publish_entity_v1: publish_entity_v1
  publish_keyword_v1: publish_keyword_v1

playbooks:
  ingest_rss_summarize:
    workflow_kind: rss_fetch_then_graph_then_synth
    description: >-
      Fetch ingested feeds, extract a bounded graph slice, synthesize over a topic.
    required_params: []
    allowed_params:
      - topic
      - recent_item_limit
    policy_bindings:
      recent_item_limit: graph_lite_max_items_per_job
    risk_tier: low

  publish_entity_v1:
    workflow_kind: publish_entity_v1
    description: Enrich entity, gate, draft, and deploy a single pSEO page.
    required_params:
      - entity_id
      - project_id
      - campaign_id
      - niche
    allowed_params:
      - entity_id
      - project_id
      - campaign_id
      - niche
      - slug
      - idempotency_key
      - page_profile
      - workflow_kind
      - keyword_source
      - target_keyword_cluster
      - delivery
      - delivery_targets
    risk_tier: medium

  publish_keyword_v1:
    workflow_kind: publish_keyword_v1
    description: Keyword-targeted publish pipeline (ENRICH → DRAFT → DEPLOY, no GATE).
    required_params:
      - project_id
      - campaign_id
      - niche
      - target_keyword_cluster
    allowed_params:
      - project_id
      - campaign_id
      - niche
      - target_keyword_cluster
      - slug
      - idempotency_key
      - page_profile
      - keyword_source
      - brand_name
      - vertical
      - workflow_kind
      - delivery
      - delivery_targets
    risk_tier: medium
