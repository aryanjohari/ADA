# M19a P0 life capture pack router (verb → tool)
# Prefixes are the canonical HUD chip prefills and prefix routes.
# Aliases are doors in this YAML only — not NLU, not per-organ Python.
packs:
  meal_log:
    tool: life_meal_log
    prefill: "log meal: "
    preferred_tools: [life_food_search, life_meal_log, life_nutrition_day]
    spine: resolve_confirm_then_log
    confirm_class: confirm_bind_on_ambiguity
  meal_draft_start:
    tool: life_meal_draft_start
    prefill: "add a meal"
    preferred_tools: [life_meal_draft_start, life_meal_draft_add, life_barcode_lookup]
    spine: draft_session
  meal_draft_save:
    tool: life_meal_draft_save
    preferred_tools: [life_meal_draft_save, life_food_preset_save]
    spine: draft_save_preset
  meal_draft_cancel:
    tool: life_meal_draft_cancel
    preferred_tools: [life_meal_draft_cancel]
    spine: draft_cancel
  meal_preset_log:
    tool: life_meal_preset_log
    prefill: "log my "
    preferred_tools: [life_meal_preset_log, life_meal_log]
    spine: expand_preset_confirm_log
  barcode_lookup:
    tool: life_barcode_lookup
    prefill: "barcode: "
    preferred_tools: [life_barcode_lookup, life_meal_draft_add, life_meal_log]
    spine: barcode_then_confirm
  lift_log:
    tool: life_lift_log
    prefill: "log lift: "
    preferred_tools: [life_lift_log]
    spine: parse_then_log
  time_start:
    tool: life_time_start
    prefill: "start focus: "
    preferred_tools: [life_time_start, life_time_status]
    spine: intent_then_start
  time_stop:
    tool: life_time_stop
    prefill: "stop focus"
    preferred_tools: [life_time_stop, life_time_status]
  capture:
    tool: life_capture
    prefill: "capture: "
    preferred_tools: [life_capture]
    spine: classify_then_write
  due_add:
    tool: memory_open_loops_upsert
    prefill: "add due: "
    preferred_tools: [memory_open_loops_upsert, memory_open_loops_list]
    spine: parse_then_upsert
  remind:
    tool: memory_open_loops_upsert
    prefill: "remind: "
    preferred_tools: [memory_open_loops_upsert, memory_open_loops_list]
    spine: parse_then_upsert
  due_done:
    tool: memory_open_loops_upsert
    prefill: "done: "
    preferred_tools: [memory_open_loops_upsert, memory_open_loops_list]
    spine: parse_then_upsert
  nutrition_day:
    tool: life_nutrition_day
    preferred_tools: [life_nutrition_day]
    spine: read
  nutrition_week:
    tool: life_nutrition_week
    preferred_tools: [life_nutrition_week]
    spine: read
  time_status:
    tool: life_time_status
    preferred_tools: [life_time_status]
    spine: read
  due_list:
    tool: memory_open_loops_list
    preferred_tools: [memory_open_loops_list]
    arg_hints:
      kind: todo
      status: open
    spine: read
  gym_status:
    tool: life_gym_status
    preferred_tools: [life_gym_status]
    spine: read
  gym_day:
    tool: life_gym_day
    preferred_tools: [life_gym_day]
    spine: read
  gym_week:
    tool: life_gym_week
    preferred_tools: [life_gym_week]
    spine: read
  gym_start:
    tool: life_gym_start
    prefill: "start gym"
    preferred_tools: [life_gym_start, life_split_set]
    spine: ask_once_then_start
  gym_end:
    tool: life_gym_end
    prefill: "end gym"
    preferred_tools: [life_gym_end, life_gym_status]
    spine: parse_then_end
  life_status:
    tool: life_nutrition_day
    preferred_tools: [life_nutrition_day, life_time_status, memory_open_loops_list]
    spine: read_concat
  focus_start:
    tool: life_time_start
    alias_of: time_start
    deprecated: true
  focus_stop:
    tool: life_time_stop
    alias_of: time_stop
    deprecated: true

chips:
  meal: meal_log
  barcode: barcode_lookup
  lift: lift_log
  focus: time_start
  due: due_add
  capture: capture

# Literal/contains, case-insensitive. First match after prefixes wins.
aliases:
  - {pattern: "add a meal", verb: meal_draft_start}
  - {pattern: "create a meal", verb: meal_draft_start}
  - {pattern: "start a meal", verb: meal_draft_start}
