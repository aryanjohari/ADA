<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <header class="top">
    <div class="brand-block">
      <h1>ADA</h1>
      <p class="tag">her control plane · Tailscale Serve · she/her</p>
    </div>
    <div class="chrome-bar" aria-label="Mode and auth">
      <label class="sr-only" for="mode-select">Mode</label>
      <select id="mode-select" title="Mode">
        <option value="observe" selected>observe</option>
        <option value="agent">agent</option>
        <option value="plan">plan</option>
      </select>
      <span id="auth-badge" class="badge mesh">auth=mesh</span>
      <span id="armed-chip" class="chip muted">agent_armed=—</span>
      <form id="login-form" class="login-form">
        <label class="sr-only" for="password">Session password</label>
        <input type="password" id="password" placeholder="session password" autocomplete="current-password" />
        <button type="submit">Login</button>
        <button type="button" id="logout-btn">Logout</button>
      </form>
      <p id="auth-msg" class="msg" role="status"></p>
    </div>
  </header>

  <div id="vitals-strip" class="vitals-strip" aria-label="Body vitals strip"></div>

  <main class="shell">
    <section class="pane pane-stream" id="pane-stream" aria-label="Stream">
      <div class="pane-head">
        <h2>Stream</h2>
        <nav class="view-tabs" aria-label="Secondary views">
          <button type="button" class="tab active" data-view="chat" id="tab-chat">Chat</button>
          <button type="button" class="tab" data-view="xray" id="tab-xray">X-ray</button>
        </nav>
      </div>

      <div id="view-chat" class="view-chat">
        <div id="stream" class="stream" role="log" aria-live="polite"></div>
        <form id="chat-form" class="chat-form">
          <label class="sr-only" for="chat-input">Message</label>
          <textarea id="chat-input" rows="2" placeholder="Message ADA…" required></textarea>
          <button type="submit" id="chat-send">Send</button>
        </form>
      </div>

      <div id="view-xray" class="view-xray" hidden>
        <div class="xray-layout">
          <aside class="xray-roots" aria-label="X-ray roots">
            <button type="button" class="root-btn active" data-root="memory">memory</button>
            <button type="button" class="root-btn" data-root="runs">runs</button>
            <button type="button" class="root-btn" data-root="outbox">outbox</button>
          </aside>
          <div class="xray-list-pane">
            <p id="xray-path" class="path">memory/</p>
            <ul id="xray-list" class="xray-list"></ul>
          </div>
          <div class="xray-preview-pane">
            <div class="preview-toolbar">
              <span id="xray-file" class="path">Select a file</span>
              <div class="preview-toggles">
                <button type="button" id="preview-rendered" class="tab active">Rendered</button>
                <button type="button" id="preview-raw" class="tab">Raw</button>
              </div>
            </div>
            <div id="xray-preview" class="xray-preview muted-empty">Choose a file under an allowlisted root.</div>
          </div>
        </div>
      </div>
    </section>

    <aside class="organism" id="organism" aria-label="Organism">
      <section class="pane" id="pane-vitals">
        <h2>Organism</h2>
        <div id="vitals-cards" class="vitals-grid"></div>
        <div id="doctor-badge" class="doctor-badge">doctor: …</div>
        <p id="vitals-meta" class="meta"></p>
      </section>

      <section class="pane compact" id="pane-lifecycle">
        <h2>Lifecycle</h2>
        <div id="lifecycle" class="lifecycle-cards"></div>
      </section>

      <section class="pane compact" id="pane-mode-detail">
        <h2>Mode</h2>
        <div id="mode-chips" class="chip-row"></div>
        <p id="denial-line" class="denial-line"></p>
      </section>

      <details class="audit desktop-audit" id="pane-raw">
        <summary>Audit / raw run tail</summary>
        <p id="run-path" class="path"></p>
        <pre id="raw-tail" class="mono">loading…</pre>
      </details>
    </aside>
  </main>

  <details class="more-mobile" id="more-mobile">
    <summary>More (lifecycle / mode / audit)</summary>
    <div id="more-mobile-slot"></div>
  </details>

  <script src="/static/app.js"></script>
</body>
</html>
