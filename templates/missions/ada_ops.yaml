  version: 1
  jobs:
    - id: daily_brief
      min_interval_hours: 24
      action:
        type: enqueue_goal
        goal_text: "Daily ops brief — run daily_brief skill or ada brief --enqueue"
recommended_cron:
  - comment: Daily deterministic brief (operator installs manually)
    line: "0 7 * * * ada brief --mission ada_ops"
  - comment: Mission tick (weekly example — adjust cadence)
    line: "0 6 * * 0 ada mission tick --mission ada_ops"
knowledge_sources: []
risk_summary: Ops programme for Ada profile — review cron snippets before apply.
