# ADA policy defaults — numbers, toggles, and limits only (no prose prompts).
# Precedence: this file → optional ADA_POLICY_PACK overlay(s) → environment (see README § Policy).
version: 1

# Bound for memory/intent.md when loaded into data-plane pipelines (not default chat persona).
intent_max_bytes: 65536

# Matrix prioritized planner (used when ADA_MATRIX_PLANNER=1; Phase 3+).
matrix_planner_top_k: 5

# Graph-lite extract job ceilings (see ada extract-graph-lite; env still resolves first, then clamped).
graph_lite_max_items_per_job: 200
graph_lite_token_cap_per_job: 8000

# Batch ada enrich-graph bounds (Phase B).
batch_enrich_max_entities: 10
batch_enrich_max_tool_rounds: 48
