[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ada"
version = "0.1.0"
description = "ADA body sense + chat harness + Tailscale Serve HUD + memory/Dream (M00–M04)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "PyYAML",
  "typer",
  "rich",
  "google-genai>=1,<3",
  "fastapi",
  "uvicorn[standard]",
  "jinja2",
  "httpx>=0.27",
  "trafilatura>=1.6",
  "feedparser>=6",
  "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
voice = ["faster-whisper", "piper-tts"]

[project.scripts]
ada = "ada.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ada.hud" = ["templates/*", "static/*"]
"ada.web.packs" = ["*.yaml"]
"ada.logs.data" = ["*.json"]
"ada.harness.packs" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "tier_a: Tier A kernel close gate (M18)",
]
