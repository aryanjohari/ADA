[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ada"
version = "0.1.0"
description = "ADA — headless agent harness (SQLite + Gemini)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "feedparser>=6.0.11",
    "pydantic>=2.0.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
streamlit = [
    "streamlit>=1.33",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "moto[s3]>=5.0.0",
]

[project.scripts]
ada = "ada.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
