title: ADA
summary: Local Python agent for edge devices—chat, background goals, RSS ingest, and SEO page publishing.
description: >
  ADA is a headless Python agent you run on your own hardware, such as a Raspberry Pi.
  One install supports interactive chat, a background worker for queued goals, offline
  ingest from RSS and Search Console, and deterministic workflows that draft and publish
  SEO pages to S3. All state lives in a single SQLite database per profile, with
  allowlisted shell commands and token budgets for cost control. Built for operators
  who want a local AI assistant with optional programmatic content pipelines—not a
  hosted SaaS.
stack:
  - Python
  - asyncio
  - Google GenAI (Gemini)
  - SQLite
  - aiosqlite
  - Pydantic
  - httpx
  - boto3
  - Streamlit
  - pytest
status: active
